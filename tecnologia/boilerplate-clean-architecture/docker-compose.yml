# Infraestructura local (aún no usada por el código de demostración).
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: eta
      POSTGRES_PASSWORD: eta
      POSTGRES_DB: eta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
